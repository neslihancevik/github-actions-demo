
name: JavaScript CI/CD Demo

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Kodu kontrol et
        run: node --check math.js

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Testleri çalıştır
        run: node --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Dağıtım örneği
        run: echo "Testler başarılı, dağıtım aşamasına geçildi!"
